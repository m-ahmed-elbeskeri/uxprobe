[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uxprobe"
version = "0.2.0"
description = "Simulated usability testing: a coding-CLI agent role-plays a user, drives your site, and logs where it struggled."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ux", "usability", "testing", "agent", "cli", "browser", "persona"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml>=6.0"]

[project.scripts]
uxprobe = "uxprobe.cli:main"

[tool.setuptools]
packages = ["uxprobe"]
